apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ingress controller. k3s' servicelb exposes the LoadBalancer service on the
# VM's :80/:443, which colima forwards to the host's 127.0.0.1.
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.6.1
    releaseName: traefik
    valuesInline:
      ingressClass:
        enabled: true
        isDefaultClass: true
      providers:
        kubernetesIngress:
          enabled: true
        # Plain Ingress only; skips Traefik CRDs.
        kubernetesCRD:
          enabled: false
      service:
        type: LoadBalancer
